services:
  # Devices dial port 2223; Coolify reaches each device at <hostname>-tunnel:<its port> over the
  # coolify network: one alias per device, since Coolify allows one server per address whatever
  # the port. The host key comes from a Coolify secret.
  coolify-tunnel:
    container_name: coolify-tunnel
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - TUNNEL_SSH_HOST_KEY_B64=${TUNNEL_SSH_HOST_KEY_B64:?}
    ports:
      - "2223:22"
    networks:
      coolify:
        aliases:
          - timeclock-dev-tunnel
          - timeclock-system-main-office-tunnel

networks:
  coolify:
    external: true
